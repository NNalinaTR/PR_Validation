<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Setter Automation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 600px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #d35400;
            font-size: 28px;
            margin-bottom: 8px;
        }
        .header p {
            color: #666;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #d35400;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .form-group small {
            color: #888;
            font-size: 12px;
            margin-top: 4px;
            display: block;
        }
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #d35400 0%, #e67e22 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(211, 84, 0, 0.4);
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .results {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
        .results.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
        }
        .results.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
        }
        .results.warning {
            background: #fff3cd;
            border: 1px solid #ffeeba;
        }
        .results.info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
        }
        .results h3 {
            margin-bottom: 10px;
        }
        .results pre {
            white-space: pre-wrap;
            font-size: 14px;
        }
        .status-table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
        }
        .status-table th, .status-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .status-table th {
            background: #f5f5f5;
        }
        .status-green { color: #28a745; font-weight: bold; }
        .status-red { color: #dc3545; font-weight: bold; }
        .loader {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        .loader .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #d35400;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Server Setter Automation</h1>
            <p>Enter server name to check ServerSitter status and CPU usage</p>
        </div>

        <form id="serverForm">
            <div class="form-group">
                <label for="serverName">Server Name</label>
                <input type="text" id="serverName" name="serverName" placeholder="e.g., c835uvdctxdr" required>
                <small>Enter the ServiceNow CI server name</small>
            </div>

            <div class="form-group">
                <label for="incNumber">INC Number (Optional)</label>
                <input type="text" id="incNumber" name="incNumber" placeholder="e.g., INC0012345">
                <small>For tracking purposes - will be used in close/escalate actions</small>
            </div>

            <button type="submit" class="btn" id="runBtn">Run Check</button>
        </form>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>Checking server status... Please wait.</p>
        </div>

        <div class="results" id="results">
            <h3 id="resultTitle">Results</h3>
            <table class="status-table" id="statusTable">
                <tr>
                    <th>Check</th>
                    <th>Status</th>
                    <th>Value</th>
                </tr>
            </table>
            <div id="actionResult" style="margin-top: 15px;"></div>
        </div>
    </div>

    <script>
        document.getElementById('serverForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const serverName = document.getElementById('serverName').value.trim();
            const incNumber = document.getElementById('incNumber').value.trim();
            const runBtn = document.getElementById('runBtn');
            const loader = document.getElementById('loader');
            const results = document.getElementById('results');

            if (!serverName) {
                alert('Please enter a server name');
                return;
            }

            // Show loader, hide results
            runBtn.disabled = true;
            loader.style.display = 'block';
            results.style.display = 'none';

            try {
                const response = await fetch('/check', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        server_name: serverName,
                        inc_number: incNumber
                    })
                });

                const data = await response.json();
                displayResults(data);

            } catch (error) {
                results.className = 'results error';
                results.style.display = 'block';
                document.getElementById('resultTitle').textContent = 'Error';
                document.getElementById('statusTable').innerHTML = `
                    <tr><td colspan="3">Failed to check server: ${error.message}</td></tr>
                `;
            } finally {
                runBtn.disabled = false;
                loader.style.display = 'none';
            }
        });

        function displayResults(data) {
            const results = document.getElementById('results');
            const resultTitle = document.getElementById('resultTitle');
            const statusTable = document.getElementById('statusTable');
            const actionResult = document.getElementById('actionResult');

            // Set result class based on action
            if (data.action === 'close') {
                results.className = 'results success';
                resultTitle.textContent = 'Server Healthy - INC Can Be Closed';
            } else if (data.action === 'escalate') {
                results.className = 'results warning';
                resultTitle.textContent = 'Escalation Required';
            } else if (data.error) {
                results.className = 'results error';
                resultTitle.textContent = 'Error';
            } else {
                results.className = 'results info';
                resultTitle.textContent = 'Check Complete';
            }

            // Build status table
            let tableHTML = `
                <tr>
                    <th>Check</th>
                    <th>Status</th>
                    <th>Value</th>
                </tr>
            `;

            // ServerSitter Status
            const ssStatus = data.server_sitter_status || 'Unknown';
            const ssClass = ssStatus.toLowerCase() === 'green' ? 'status-green' : 'status-red';
            tableHTML += `
                <tr>
                    <td>ServerSitter Status</td>
                    <td class="${ssClass}">${ssStatus.toUpperCase()}</td>
                    <td>-</td>
                </tr>
            `;

            // PerfStat Status
            const psStatus = data.perfstat_accessible ? 'Accessible' : 'Error';
            const psClass = data.perfstat_accessible ? 'status-green' : 'status-red';
            tableHTML += `
                <tr>
                    <td>PerfStat</td>
                    <td class="${psClass}">${psStatus}</td>
                    <td>${data.perfstat_error || '-'}</td>
                </tr>
            `;

            // CPU Usage
            if (data.cpu_usage !== undefined && data.cpu_usage !== null) {
                const cpuClass = data.cpu_usage < 80 ? 'status-green' : 'status-red';
                tableHTML += `
                    <tr>
                        <td>CPU Usage (Max)</td>
                        <td class="${cpuClass}">${data.cpu_usage < 80 ? 'OK' : 'HIGH'}</td>
                        <td>${data.cpu_usage}%</td>
                    </tr>
                `;
            }

            statusTable.innerHTML = tableHTML;

            // Action result
            if (data.action === 'close') {
                actionResult.innerHTML = `
                    <strong>Recommended Action:</strong> Close INC<br>
                    <strong>Close Statement:</strong><br>
                    <pre>${data.close_statement || 'Server check passed.'}</pre>
                `;
            } else if (data.action === 'escalate') {
                actionResult.innerHTML = `
                    <strong>Recommended Action:</strong> Escalate<br>
                    <strong>Snow Group:</strong> ${data.escalate_to || 'N/A'}<br>
                    <strong>Description:</strong><br>
                    <pre>${data.escalation_description || ''}</pre>
                `;
            } else if (data.error) {
                actionResult.innerHTML = `<strong>Error:</strong> ${data.error}`;
            }

            results.style.display = 'block';
        }
    </script>
</body>
</html>
