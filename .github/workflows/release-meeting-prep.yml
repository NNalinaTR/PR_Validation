name: Release Meeting Prep

on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: 'Release tag to compare from (blank = latest tag; no tags = all merged PRs)'
        required: false
        default: ''
        type: string
      required_approvals:
        description: 'Approvals each PR should have'
        required: false
        default: '1'
        type: string
      ai_summary:
        description: 'Add AI summary and release notes (Apex AI, needs APEX_* secrets and a TR-network runner)'
        required: false
        default: true
        type: boolean
      create_issue:
        description: 'Create a GitHub issue with the meeting agenda'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  issues: write

jobs:
  prep:
    name: Prepare release item meeting
    # Apex is only reachable from the TR network: set the RUNNER_LABELS variable to a TR
    # self-hosted runner, e.g. ["self-hosted","linux"]. Defaults to GitHub-hosted (no Apex).
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') }}
    env:
      HAS_APEX: ${{ secrets.APEX_CLIENT_ID != '' && secrets.APEX_CLIENT_SECRET != '' && vars.APEX_BASE_URL != '' }}

    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Collect and check release PRs
        id: collect
        uses: actions/github-script@v8
        env:
          FROM_TAG: ${{ inputs.from_tag }}
          REQUIRED_APPROVALS: ${{ inputs.required_approvals }}
        with:
          script: |
            const { collect } = require('./.github/scripts/release-meeting-prep.js');
            await collect({ github, context, core });

      - name: AI summary (Apex)
        id: ai
        if: inputs.ai_summary && steps.collect.outputs.pr_count != '0' && env.HAS_APEX == 'true'
        continue-on-error: true
        timeout-minutes: 15
        uses: actions/github-script@v8
        env:
          APEX_BASE_URL: ${{ vars.APEX_BASE_URL }}
          APEX_APP_ID: ${{ vars.APEX_APP_ID }}
          APEX_CLIENT_ID: ${{ secrets.APEX_CLIENT_ID }}
          APEX_CLIENT_SECRET: ${{ secrets.APEX_CLIENT_SECRET }}
        with:
          script: |
            const { aiSummary } = require('./.github/scripts/release-meeting-prep.js');
            await aiSummary({ core });

      - name: Publish report and meeting issue
        id: publish
        uses: actions/github-script@v8
        env:
          CREATE_ISSUE: ${{ inputs.create_issue }}
          AI_STATUS: ${{ !inputs.ai_summary && 'disabled' || steps.collect.outputs.pr_count == '0' && 'no-prs' || env.HAS_APEX != 'true' && 'no-secret' || steps.ai.outcome }}
        with:
          script: |
            const { publish } = require('./.github/scripts/release-meeting-prep.js');
            await publish({ github, context, core });
