name: Release Meeting Prep

on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: 'Release tag to compare from (blank = latest tag; no tags = all merged PRs)'
        required: false
        default: ''
        type: string
      required_approvals:
        description: 'Approvals each PR should have'
        required: false
        default: '1'
        type: string
      ai_summary:
        description: 'Add AI summary and release notes (Copilot CLI, needs COPILOT_PAT secret)'
        required: false
        default: true
        type: boolean
      create_issue:
        description: 'Create a GitHub issue with the meeting agenda'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  issues: write

jobs:
  prep:
    name: Prepare release item meeting
    runs-on: ubuntu-latest
    env:
      HAS_COPILOT_PAT: ${{ secrets.COPILOT_PAT != '' }}

    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Collect and check release PRs
        id: collect
        uses: actions/github-script@v8
        env:
          FROM_TAG: ${{ inputs.from_tag }}
          REQUIRED_APPROVALS: ${{ inputs.required_approvals }}
        with:
          script: |
            const { collect } = require('./.github/scripts/release-meeting-prep.js');
            await collect({ github, context, core });

      # AI step: swap this block for an Apex API call later; it only needs to write ai-summary.md.
      - name: Set up Node.js for Copilot CLI
        if: inputs.ai_summary && steps.collect.outputs.pr_count != '0' && env.HAS_COPILOT_PAT == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Copilot CLI
        if: inputs.ai_summary && steps.collect.outputs.pr_count != '0' && env.HAS_COPILOT_PAT == 'true'
        run: npm install -g @github/copilot

      - name: AI summary
        id: ai
        if: inputs.ai_summary && steps.collect.outputs.pr_count != '0' && env.HAS_COPILOT_PAT == 'true'
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          copilot -p "$(cat release-prompt.txt)" -s --no-ask-user > ai-summary.md
          echo "AI summary written ($(wc -c < ai-summary.md) bytes)."

      - name: Publish report and meeting issue
        id: publish
        uses: actions/github-script@v8
        env:
          CREATE_ISSUE: ${{ inputs.create_issue }}
          AI_STATUS: ${{ !inputs.ai_summary && 'disabled' || steps.collect.outputs.pr_count == '0' && 'no-prs' || env.HAS_COPILOT_PAT != 'true' && 'no-secret' || steps.ai.outcome }}
        with:
          script: |
            const { publish } = require('./.github/scripts/release-meeting-prep.js');
            await publish({ github, context, core });
