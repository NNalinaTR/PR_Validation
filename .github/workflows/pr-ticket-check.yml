name: PR Ticket Check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  ticket-check:
    name: Require ADO ticket (AB#)
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title and commit messages for AB#<id>
        uses: actions/github-script@v7
        with:
          script: |
            const ticket = /\bAB#\d+\b/;
            const pr = context.payload.pull_request;

            if (ticket.test(pr.title)) {
              core.info(`Ticket found in PR title: "${pr.title}"`);
              return;
            }

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const match = commits.find(c => ticket.test(c.commit.message));
            if (match) {
              const subject = match.commit.message.split('\n')[0];
              core.info(`Ticket found in commit ${match.sha.substring(0, 7)}: "${subject}"`);
              return;
            }

            core.setFailed(
              `No ADO ticket found. Add a work item like "AB#12345" to the PR title or to at least one commit message.\n` +
              `PR title: "${pr.title}"\n` +
              `Commits checked: ${commits.length}`
            );
