# Server Setter Automation Configuration
# ========================================

# Gotmon Settings
gotmon:
  url: "http://gotmon.int.thomsonreuters.com/index.php"

# Thresholds
thresholds:
  cpu_max_percentage: 80  # If CPU usage > 80%, escalate

# Escalation Settings
escalation:
  # When ServerSitter is RED and CPU > 80%
  red_status_high_cpu:
    snow_group: "YOUR_SNOW_GROUP_FOR_RED_STATUS"
    description: |
      Server health check failed:
      - ServerSitter Status: RED
      - CPU Usage: Above 80%
      Please investigate and resolve.

  # When ServerSitter is GREEN but PerfStat errors
  perfstat_error:
    snow_group: "YOUR_SNOW_GROUP_FOR_PERFSTAT_ERROR"
    description: |
      Server health check incomplete:
      - ServerSitter Status: GREEN
      - PerfStat: Unable to open/error
      Please investigate PerfStat availability.

# Close Statement (when everything is healthy)
close_statement: |
  Server health check completed successfully:
  - ServerSitter Status: GREEN
  - PerfStat: Accessible
  - CPU Usage: Below 80%
  No action required. Closing incident.

# Browser Settings
browser:
  headless: false  # Set to true to run browser in background
  timeout: 30      # Seconds to wait for page elements

# ServiceNow API (for Phase 2)
servicenow:
  instance: "your-instance.service-now.com"
  # Credentials should be set via environment variables:
  # SNOW_USERNAME and SNOW_PASSWORD
